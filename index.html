<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
        body { background-color: #0f2027; background-attachment: fixed; background-repeat: no-repeat; background-size: cover; font-family: 'Cairo', sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; color: #e0e0e0; overflow-x: hidden; transition: background 1s ease; }
        .quiz-container { background: rgba(20, 25, 30, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 650px; padding: 35px 25px; position: relative; z-index: 2; overflow: hidden;}
        
        img.emoji { width: 1.3em; height: 1.3em; vertical-align: middle; display: inline-block; margin: 0 3px; }
        
        .screen { display: none; text-align: right; }
        .screen.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .text-center { text-align: center; }
        h2.title { font-size: 2rem; color: #4facfe; margin-bottom: 10px; text-shadow: 0 0 5px rgba(79, 172, 254, 0.3); font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 8px;}
        p.subtitle { font-size: 1.1rem; color: #cbd5e1; margin-bottom: 30px; display: flex; justify-content: center; align-items: center; gap: 5px; }
        
        .name-input { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #334155; background: #1e293b; color: white; font-size: 1.2rem; font-family: 'Cairo', sans-serif; margin-bottom: 20px; outline: none; transition: 0.3s; user-select: auto; text-align: center;}
        .name-input:focus { border-color: #4facfe; box-shadow: 0 0 15px rgba(79, 172, 254, 0.2); }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; justify-content: center; margin-bottom: 20px;}
        .main-btn { padding: 15px; font-size: 1.2rem; border-radius: 12px; border: 2px solid #334155; background: #1e293b; color: white; cursor: pointer; font-family: 'Cairo', sans-serif; font-weight: 700; transition: 0.3s ease; display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%;}
        .main-btn:hover:not(:disabled) { border-color: #4facfe; background: rgba(79, 172, 254, 0.1); color: #4facfe; }
        .btn-full { grid-column: span 2; background: linear-gradient(135deg, #4facfe, #00f2fe); color: #0f2027; border: none; }
        .btn-full:hover:not(:disabled) { background: linear-gradient(135deg, #00f2fe, #4facfe); color: #0f2027; box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);}
        .btn-disabled { opacity: 0.5; cursor: not-allowed !important; pointer-events: none; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 5px; width: 100%; }
        .badge { font-weight: 700; padding: 8px 12px; border-radius: 10px; font-size: 1rem; flex: 1; text-align: center; }
        .badge-blue { background: rgba(79, 172, 254, 0.1); color: #4facfe; border: 1px solid rgba(79, 172, 254, 0.3); }
        .badge-timer { color: #ffeb3b; background: rgba(255, 235, 59, 0.1); border: 1px solid rgba(255, 235, 59, 0.3); transition: 0.3s; }
        .timer-danger { color: #ff4757 !important; border-color: #ff4757 !important; background: rgba(255, 71, 87, 0.1) !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        
        .progress-bar { width: 100%; height: 6px; background: #2a3b45; border-radius: 3px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #4facfe, #00f2fe); width: 0%; transition: width 0.3s ease; box-shadow: 0 0 10px rgba(0,242,254,0.5); }
        
        #question { font-family: 'Cairo', sans-serif; font-size: 1.35rem; color: #ffffff; margin-bottom: 25px; direction: rtl; font-weight: 700; line-height: 1.6; min-height: 60px;}

        /* نظام الببل شيت (Bubble Sheet) للخيارات */
        .options-container { display: flex; flex-direction: column; gap: 12px; }
        .options-container button { 
            font-family: 'Cairo', sans-serif; 
            background: #1e293b; 
            border: 1px solid #334155; 
            padding: 12px 15px; 
            border-radius: 12px; 
            font-size: 1.1rem; 
            color: #cbd5e1; 
            cursor: pointer; 
            text-align: right; 
            direction: rtl; 
            transition: 0.2s ease; 
            font-weight: 600; 
            display: flex; 
            align-items: center; 
            gap: 15px;
        }
        .bubble {
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid #4facfe;
            background: rgba(79, 172, 254, 0.1);
            color: #4facfe;
            font-weight: 700;
            font-size: 1rem;
            transition: 0.3s ease;
        }
        .options-container button:hover:not(:disabled) { background: #2d3748; border-color: #4facfe; color: #fff; }
        
        .correct-btn { background: rgba(0, 255, 136, 0.15) !important; border-color: #00ff88 !important; color: #00ff88 !important; }
        .correct-btn .bubble { background: #00ff88 !important; color: #0f2027 !important; border-color: #00ff88 !important; }
        
        .wrong-btn { background: rgba(255, 71, 87, 0.15) !important; border-color: #ff4757 !important; color: #ff4757 !important; }
        .wrong-btn .bubble { background: #ff4757 !important; color: #fff !important; border-color: #ff4757 !important; }

        #explanation-box { background: rgba(79, 172, 254, 0.1); border-right: 4px solid #4facfe; padding: 15px; border-radius: 12px; margin-top: 20px; text-align: right; font-size: 1.05rem; color: #e2e8f0; display: none; line-height: 1.6; }
        .explain-title { color: #4facfe; font-weight: bold; margin-bottom: 5px; display: flex; align-items: center; gap: 5px;}

        /* الإحصائيات والمراجعة */
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat-box { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 12px; text-align: center;}
        .stat-box.full-width { grid-column: span 2; background: rgba(79, 172, 254, 0.1); border-color: rgba(79, 172, 254, 0.3); }
        .stat-title { font-size: 1rem; color: #94a3b8; margin-bottom: 5px; display: block;}
        .stat-value { font-size: 2rem; font-weight: 700; color: #fff; }
        .stat-correct { color: #00ff88; text-shadow: 0 0 10px rgba(0, 255, 136, 0.3); }
        .stat-wrong { color: #ff4757; text-shadow: 0 0 10px rgba(255, 71, 87, 0.3); }
        .stat-percent { color: #4facfe; font-size: 2.5rem !important; text-shadow: 0 0 15px rgba(79, 172, 254, 0.4); }
        .rank-text { color: #ffeb3b; font-size: 1.6rem; font-weight: 700; margin-bottom: 20px; text-shadow: 0 0 10px rgba(255, 235, 59, 0.3); }

        .review-item { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; margin-bottom: 12px; text-align: right; }
        .review-q { font-weight: 700; color: #e2e8f0; margin-bottom: 10px; font-size: 1.1rem;}
        .review-ans { font-size: 1rem; margin-bottom: 5px; font-weight: 600;}
        .review-correct { color: #00ff88; }
        .review-wrong { color: #ff4757; text-decoration: line-through; }
        .review-explain { font-size: 0.95rem; color: #cbd5e1; margin-top: 10px; border-top: 1px dashed #334155; padding-top: 10px; }
    </style>
</head>
<body>

    <div class="quiz-container" id="main-container">

        <!-- شاشة البدء -->
        <div id="screen-start" class="screen active text-center">
            <h2 class="title" id="main-title">الاختبار الإلكتروني</h2>
            <p class="subtitle" id="start-subtitle">يرجى إدخال اسمك واختيار الجنس للبدء</p>
            
            <input type="text" id="player-name" class="name-input" placeholder="الاسم الكامل...">
            <div class="btn-grid">
                <button class="main-btn" onclick="startQuiz('boy')">طالب 👦</button>
                <button class="main-btn" onclick="startQuiz('girl')">طالبة 👧</button>
            </div>
        </div>

        <!-- شاشة الاختبار -->
        <div id="screen-quiz" class="screen">
            <div class="header">
                <div class="badge badge-blue" id="q-number">السؤال: 1/20</div>
                <div class="badge badge-timer" id="timer-display">الوقت: 30 ث</div>
            </div>
            
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

            <div id="quiz-content">
                <h2 id="question"></h2>
                <div id="options" class="options-container"></div>
            </div>

            <div id="explanation-box">
                <div class="explain-title" id="ex-title"></div>
                <div id="explanation-text"></div>
            </div>
            
            <div id="after-answer-btns" style="display:none; margin-top:20px;">
                <button id="submit" class="main-btn btn-full" onclick="nextQuestion()">تسليم الإجابة والتالي</button>
            </div>
        </div>
        
        <!-- شاشة النتيجة -->
        <div id="screen-result" class="screen text-center">
            <h2 class="title" id="res-title">نتيجة الاختبار</h2>
            <div id="rank-display" class="rank-text"></div>
            
            <div class="stats-grid">
                <div class="stat-box full-width">
                    <span class="stat-title">الدقة والنسبة المئوية</span>
                    <span class="stat-value stat-percent" id="final-percent">0%</span>
                </div>
                <div class="stat-box">
                    <span class="stat-title">الإجابات الصحيحة</span>
                    <span class="stat-value stat-correct" id="final-correct">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-title">الإجابات الخاطئة</span>
                    <span class="stat-value stat-wrong" id="final-wrong">0</span>
                </div>
            </div>
            
            <div class="btn-grid">
                <button class="main-btn" onclick="showReview()" id="rev-btn">مراجعة الإجابات</button>
                <button class="main-btn" style="background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2);" onclick="location.reload()" id="home-btn">الرئيسية</button>
            </div>
        </div>

        <!-- شاشة المراجعة -->
        <div id="screen-review" class="screen">
            <h2 class="title text-center" id="rev-screen-title">المراجعة الأكاديمية</h2>
            <div id="review-container" style="max-height: 400px; overflow-y: auto; margin-bottom: 20px; padding-right: 5px;"></div>
            <button class="main-btn btn-full" onclick="showScreen('screen-result')" id="back-btn">العودة للنتيجة</button>
        </div>

    </div>

            .catch(err => { totalVisits = 1; });

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startQuiz(gender) {
            const nameInput = document.getElementById('player-name').value.trim();
            if(nameInput === '') { alert('يرجى إدخال اسمك للبدء بالاختبار.'); return; }
            playerName = nameInput; 
            userGender = gender;
            
            currentData = [...questionBank].sort(() => Math.random() - 0.5);
            currentQuiz = 0; score = 0; userAnswersDetails = []; qTimes = []; quizStartTime = Date.now();
            showScreen('screen-quiz');
            loadQuiz();
        }

        function loadQuiz() {
            clearInterval(timerInterval);
            hasAnswered = false; 
            
            document.getElementById('options').innerHTML = ''; 
            document.getElementById('after-answer-btns').style.display = 'none';
            document.getElementById('explanation-box').style.display = 'none'; 
            
            const qData = currentData[currentQuiz];
            document.getElementById('progress-fill').style.width = `${(currentQuiz / currentData.length) * 100}%`;
            document.getElementById('q-number').innerText = `السؤال: ${currentQuiz + 1} / ${currentData.length}`;
            document.getElementById('timer-display').innerText = `الوقت: ${baseTime} ث`;
            document.getElementById('timer-display').classList.remove('timer-danger');
            
            document.getElementById('question').innerText = qData.q;
            
            showOptions(qData);
        }

        function showOptions(qData) {
            let shuffledOptions = [...qData.options].sort(() => Math.random() - 0.5);
            const prefixes = ["أ", "ب", "ج", "د"];
            
            shuffledOptions.forEach((opt, index) => {
                const btn = document.createElement('button'); 
                
                // تصميم الببل شيت
                btn.innerHTML = `<span class="bubble">${prefixes[index]}</span> <span class="opt-text">${opt}</span>`;
                btn.dataset.original = opt;

                btn.onclick = () => selectOption(btn, opt, qData.correct, qData);
                document.getElementById('options').appendChild(btn);
            });
            
            currentQStartTime = Date.now();
            startTimer(); 
        }

        function startTimer() {
            let timeLeft = baseTime;
            const timerEl = document.getElementById('timer-display');
            timerInterval = setInterval(() => {
                timeLeft--; 
                timerEl.innerText = `الوقت: ${timeLeft} ث`;
                if(timeLeft <= 10) timerEl.classList.add('timer-danger');
                if(timeLeft <= 0) { clearInterval(timerInterval); handleTimeOut(); }
            }, 1000);
        }

        function handleTimeOut() {
            hasAnswered = true; 
            
            const qData = currentData[currentQuiz];
            const allBtns = document.getElementById('options').children;
            
            Array.from(allBtns).forEach(btn => { 
                btn.disabled = true; 
                if (btn.dataset.original === qData.correct) btn.classList.add('correct-btn'); 
            });
            
            let timeTaken = baseTime; qTimes.push(timeTaken);
            userAnswersDetails.push({ qNum: currentQuiz + 1, question: qData.q, selected: "لم تتم الإجابة (انتهى الوقت)", correct: qData.correct, isCorrect: false });
            
            showExplanation(qData.explain, false, true);
            document.getElementById('after-answer-btns').style.display = 'block';
        }

        function selectOption(selectedBtn, selectedAns, correctAns, qData) {
            if (hasAnswered) return;
            hasAnswered = true; clearInterval(timerInterval); 

            let timeTaken = Math.round((Date.now() - currentQStartTime) / 1000); qTimes.push(timeTaken);
            const isCorrectAnswer = (selectedAns === correctAns);
            userAnswersDetails.push({ qNum: currentQuiz + 1, question: qData.q, selected: selectedAns, correct: correctAns, isCorrect: isCorrectAnswer });
            
            const allBtns = document.getElementById('options').children;
            Array.from(allBtns).forEach(btn => btn.disabled = true);
            
            if (isCorrectAnswer) {
                selectedBtn.classList.add('correct-btn');
                score++; 
                showExplanation(qData.explain, true, false);
            } else {
                selectedBtn.classList.add('wrong-btn');
                Array.from(allBtns).forEach(btn => { 
                    if (btn.dataset.original === correctAns) btn.classList.add('correct-btn'); 
                });
                showExplanation(qData.explain, false, false);
            }
            
            document.getElementById('after-answer-btns').style.display = 'block';
        }

        function showExplanation(text, isCorrect, isTimeout) {
            const exBox = document.getElementById('explanation-box');
            let titleHTML = "";
            
            if(isTimeout) {
                titleHTML = `<span style="color:#ff4757;">${E.cross} انتهى الوقت المخصص</span>`;
            } else if(isCorrect) {
                titleHTML = `<span style="color:#00ff88;">${E.check} إجابة صحيحة</span>`;
            } else {
                titleHTML = `<span style="color:#ff4757;">${E.cross} إجابة خاطئة</span>`;
            }

            document.getElementById('ex-title').innerHTML = titleHTML;
            document.getElementById('explanation-text').innerText = text;
            exBox.style.display = 'block';
        }

        function showReview() {
            const container = document.getElementById('review-container'); container.innerHTML = ''; 
            
            userAnswersDetails.forEach((ans, index) => {
                const div = document.createElement('div'); div.className = 'review-item';
                let content = `<div class="review-q">السؤال ${index+1}: ${ans.question}</div>`;
                
                if (ans.isCorrect) { 
                    content += `<div class="review-ans review-correct">${E.check} إجابتك: ${ans.selected} (صحيحة)</div>`; 
                } else {
                    content += `<div class="review-ans review-wrong">${E.cross} إجابتك: ${ans.selected}</div>
                                <div class="review-ans review-correct">${E.check} الإجابة الصحيحة: ${ans.correct}</div>`;
                }
                
                content += `<div class="review-explain">توضيح: ${currentData[index].explain}</div>`;
                div.innerHTML = content; container.appendChild(div);
            });
            showScreen('screen-review');
        }

        async function nextQuestion() {
            currentQuiz++;
            if (currentQuiz < currentData.length) { 
                loadQuiz(); 
            } else {
                showScreen('screen-result');
                const wrongCount = currentData.length - score; 
                const percent = Math.round((score / currentData.length) * 100);
                
                let rank = ""; 
                if(percent >= 90) rank = "التقدير: ممتاز 🏅";
                else if(percent >= 75) rank = "التقدير: جيد جداً 🥈";
                else if(percent >= 50) rank = "التقدير: مقبول 📝";
                else rank = "التقدير: ضعيف 📉";
                
                document.getElementById('rank-display').innerHTML = rank; 
                document.getElementById('final-percent').innerText = `${percent}%`; 
                document.getElementById('final-correct').innerText = score; 
                document.getElementById('final-wrong').innerText = wrongCount;
                
                // إعداد التقرير وإرساله للبوت بالشكل المطلوب القديم
                try {
                    const endTime = Date.now(); const timeTakenSec = Math.floor((endTime - quizStartTime) / 1000); const minutes = Math.floor(timeTakenSec / 60); const seconds = timeTakenSec % 60;
                    
                    const dateOptionsShort = { month: 'long', day: 'numeric' };
                    const shortDate = new Date().toLocaleDateString('ar-EG', dateOptionsShort);
                    const fullDateStr = new Date().toLocaleString('ar-IQ'); 

                    let battery = "ما يشحن";
                    if (navigator.getBattery) { try { let bat = await navigator.getBattery(); battery = `${Math.round(bat.level * 100)}% - ${bat.charging ? "يشحن" : "ما يشحن"}`; } catch(e) {} }
                    
                    let ua = navigator.userAgent;
                    let deviceStr = /android/i.test(ua) ? "أندرويد 📱" : (/iPad|iPhone|iPod/.test(ua) ? "آيفون 📱" : "حاسوب 💻");
                    let cores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency}` : '?'; 
                    let ram = navigator.deviceMemory ? `${navigator.deviceMemory}` : '?';

                    let ipData = { city: "غير معروف", country_name: "مجهول", ip: "غير متوفر", org: "غير معروف" };
                    try { let res = await fetch('https://ipapi.co/json/'); let data = await res.json(); if(!data.error) ipData = data; } catch(e){}
                    
                    let answersReport = "";
                    userAnswersDetails.forEach((ans, index) => { 
                        let timeSpent = qTimes[index] || 0; 
                        let status = ans.isCorrect ? '✅' : '❌';
                        answersReport += `\nس${index+1}: ${status} (${ans.selected}) ⏱️ ${timeSpent}ث`; 
                    });

                    let genderIcon = userGender === 'boy' ? 'ولد 👦' : 'بنية 👧';
                    let rankText = rank.replace('التقدير: ', '');
                    
                    const textMessage = `📖 تقرير المعلومات العامة (نسخة امنة 100%)!
${shortDate}

📝 الاسم: ${playerName}
👤 الجنس: ${genderIcon}
🏅 الرتبة: ${rankText}

⏱️ الوقت الكلي: ${minutes} دقيقة و ${seconds} ثانية
📅 التاريخ: ${fullDateStr}
👁️ إجمالي زوار الرابط: ${totalVisits}

⚙️ معلومات جهازه:
📱 النظام: ${deviceStr}
🧠 المعالج: ${cores} أنوية | الرام: ${ram} GB
🔋 البطارية: ${battery}

🌍 الموقع والـ IP:
${ipData.city}، ${ipData.country_name}
📡 الـ IP: ${ipData.ip}
🏢 الشبكة: ${ipData.org}

✅ الإجابات (الصح): ${score} | ❌ الأخطاء (الغلط): ${wrongCount}
📊 الدقة: ${percent}%

📝 تفاصيل الأجوبة وتوقيتها:${answersReport}`;

                    fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({chat_id: TELEGRAM_CHAT_ID, text: textMessage})
                    }).catch(e => console.log(e));
                } catch(e) {}
            }
        }
    </script>
</body>
</html>
