<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحدي المعلومات العامة</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
        body { background-color: #0f2027; background-attachment: fixed; background-repeat: no-repeat; background-size: cover; font-family: 'Cairo', sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; color: #e0e0e0; overflow-x: hidden; transition: background 1s ease; }
        .quiz-container { background: rgba(20, 25, 30, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 650px; padding: 30px 20px; position: relative; z-index: 2; overflow: hidden;}
        
        /* إعدادات إيموجي الايفون */
        img.emoji { width: 1.3em; height: 1.3em; vertical-align: middle; display: inline-block; margin: 0 3px; }
        
        .screen { display: none; text-align: center; }
        .screen.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        h2.title { font-size: 2rem; color: #4facfe; margin-bottom: 10px; text-shadow: 0 0 5px rgba(79, 172, 254, 0.3); display: flex; justify-content: center; align-items: center; gap: 8px;}
        p.subtitle { font-size: 1.1rem; color: #cbd5e1; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; gap: 5px; }
        
        .name-input { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #334155; background: #1e293b; color: white; font-size: 1.2rem; font-family: 'Cairo', sans-serif; margin-bottom: 25px; text-align: center; outline: none; transition: 0.2s; }
        .name-input:focus { border-color: #4facfe; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; justify-content: center; margin-bottom: 20px;}
        .main-btn { padding: 15px; font-size: 1.2rem; border-radius: 15px; border: 2px solid #334155; background: #1e293b; color: white; cursor: pointer; font-family: 'Cairo', sans-serif; font-weight: bold; transition: 0.2s ease; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .main-btn:hover:not(:disabled) { border-color: #4facfe; background: rgba(79, 172, 254, 0.1); color: #4facfe; }
        .btn-full { grid-column: span 2; background: linear-gradient(135deg, #4facfe, #00f2fe); color: #0f2027; border: none; }
        .btn-full:hover:not(:disabled) { background: linear-gradient(135deg, #00f2fe, #4facfe); color: #0f2027; }
        
        .roulette-box { width: 100%; padding: 15px; background: rgba(0,0,0,0.4); border-radius: 12px; margin-bottom: 20px; border: 1px dashed #4facfe; text-align: center; }
        .roulette-result { font-size: 1.5rem; font-weight: bold; color: #ffeb3b; min-height: 40px; display: flex; justify-content: center; align-items: center; gap: 8px;}

        /* الشاشات المنبثقة */
        .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 32, 39, 0.98); z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; animation: fadeIn 0.3s; }
        .overlay-icon { margin-bottom: 15px; font-size: 4rem; }
        .overlay-icon img.emoji { width: 5rem; height: 5rem; }
        .call-anim { animation: pulseCall 1s infinite; }
        .overlay-text { color: #fff; font-size: 1.3rem; text-align: center; padding: 0 20px; line-height: 1.6; }
        @keyframes pulseCall { 0% { transform: scale(1) rotate(0); } 50% { transform: scale(1.1) rotate(10deg); filter: drop-shadow(0 0 10px #00ff88); } 100% { transform: scale(1) rotate(0); } }

        /* شاشة طفت الوطنية */
        #blackout { background: #000; z-index: 20000; color: #fff; text-align: center; padding: 20px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 5px; width: 100%; margin-top: 15px; }
        .badge { font-weight: bold; padding: 6px 4px; border-radius: 10px; font-size: 0.9rem; flex: 1; text-align: center; white-space: nowrap; display: flex; justify-content: center; align-items: center; gap: 4px; }
        .badge-blue { background: #4facfe; color: #fff; }
        .badge-green { color: #00ff88; background: rgba(0, 255, 136, 0.1); border: 1px solid rgba(0, 255, 136, 0.3); }
        .badge-timer { color: #ffeb3b; background: rgba(255, 235, 59, 0.1); border: 1px solid rgba(255, 235, 59, 0.3); }
        
        .progress-bar { width: 100%; height: 6px; background: #2a3b45; border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: #4facfe; width: 0%; transition: width 0.3s ease; }
        
        #question { font-family: 'Cairo', sans-serif; font-size: 1.3rem; color: #ffffff; margin-bottom: 20px; direction: rtl; font-weight: bold; line-height: 1.5; min-height: 55px;}
        .cursor { display: inline-block; width: 6px; height: 1.1rem; background: #4facfe; margin-right: 4px; animation: blink 0.7s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        .options-container { display: flex; flex-direction: column; gap: 10px; }
        .options-container button { font-family: 'Poppins', sans-serif; background: #1e293b; border: 1px solid #334155; padding: 12px 15px; border-radius: 12px; font-size: 1.1rem; color: #cbd5e1; cursor: pointer; text-align: right; direction: rtl; transition: 0.2s ease; font-weight: 500; }
        .options-container button:hover:not(:disabled) { background: #2d3748; border-color: #4facfe; }
        .correct-btn { background: rgba(0, 255, 136, 0.15) !important; border-color: #00ff88 !important; color: #00ff88 !important; }
        .wrong-btn { background: rgba(255, 71, 87, 0.15) !important; border-color: #ff4757 !important; color: #ff4757 !important; box-shadow: 0 0 15px rgba(255, 71, 87, 0.4) !important; animation: shake 0.4s; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }
        
        #iraqi-feedback { margin-top: 10px; text-align: center; font-size: 1.1rem; font-weight: bold; min-height: 25px; transition: 0.2s; opacity: 0; display: flex; justify-content: center; align-items: center; gap: 5px;}
        .feedback-good { color: #00ff88; text-shadow: 0 0 10px rgba(0,255,136,0.3);}
        .feedback-bad { color: #ff4757; text-shadow: 0 0 10px rgba(255,71,87,0.3);}
        .show-feedback { opacity: 1 !important; }
        
        .btn-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 15px;}
        .action-btn { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 8px; border-radius: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; font-family: 'Cairo', sans-serif; font-size: 0.9rem; font-weight: bold; }
        .action-btn:hover:not(:disabled) { background: #2d3748; color: #fff; border-color: #4facfe;}
        .action-btn span img.emoji { width: 1.2rem; height: 1.2rem; margin: 0; }
        .btn-disabled { opacity: 0.4; cursor: not-allowed !important; pointer-events: none; }

        #explanation-box { background: rgba(79, 172, 254, 0.1); border-right: 3px solid #4facfe; padding: 12px; border-radius: 8px; margin-top: 12px; text-align: right; font-size: 1rem; color: #e2e8f0; display: none; line-height: 1.5; }
        .explain-title { color: #4facfe; font-weight: bold; margin-bottom: 5px; display: flex; align-items: center; gap: 5px;}
        
        .vote-bar-bg { background: #334155; height: 10px; border-radius: 5px; margin: 4px 0 10px 0; overflow: hidden; }
        .vote-bar-fill { height: 100%; background: #4facfe; width: 0%; transition: width 0.5s ease; }

        .hidden { display: none !important; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-box { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; text-align: center;}
        .stat-box.full-width { grid-column: span 2; background: rgba(79, 172, 254, 0.1); border-color: rgba(79, 172, 254, 0.3); }
        .stat-title { font-size: 1rem; color: #94a3b8; margin-bottom: 5px; display: flex; justify-content: center; align-items: center; gap: 5px;}
        .stat-value { font-size: 1.8rem; font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 5px;}
        .stat-correct { color: #00ff88; }
        .stat-wrong { color: #ff4757; }
        .stat-percent { font-size: 2.2rem; color: #4facfe; }
        .rank-text { color: #ffeb3b; font-size: 1.3rem; font-weight: bold; margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 5px;}
        
        .review-item { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 12px; margin-bottom: 10px; text-align: right; direction: rtl; }
        .review-q { font-weight: bold; color: #cbd5e1; margin-bottom: 8px; font-size: 1rem;}
        .review-ans { font-size: 1rem; margin-bottom: 4px; display: flex; align-items: center; gap: 5px;}
        .review-correct { color: #00ff88; }
        .review-wrong { color: #ff4757; text-decoration: line-through; }
        .review-roast { font-size: 0.9rem; color: #ffeb3b; font-style: italic; margin-top: 6px; border-top: 1px dashed #334155; padding-top: 6px; display: flex; align-items: center; gap: 5px;}

        /* المراقب التفاعلي (الافاتار) */
        .avatar-container { position: fixed; bottom: 20px; left: 20px; background: rgba(30, 41, 59, 0.95); border: 2px solid #4facfe; border-radius: 50%; width: 75px; height: 75px; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 15px rgba(79, 172, 254, 0.4); z-index: 1000; transition: all 0.3s ease; display: none; }
        .avatar-container.active-avatar { display: flex; animation: popIn 0.5s; }
        .avatar-container img.emoji { width: 3.5rem; height: 3.5rem; margin: 0; }
        .avatar-shake { animation: avatarShake 0.4s; }
        .avatar-jump { animation: avatarJump 0.5s; }
        @keyframes popIn { 0% { transform: scale(0); } 80% { transform: scale(1.2); } 100% { transform: scale(1); } }
        @keyframes avatarShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px) rotate(-10deg); } 50% { transform: translateX(8px) rotate(10deg); } 75% { transform: translateX(-8px) rotate(-10deg); } }
        @keyframes avatarJump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

    </style>
</head>
<body>

    <!-- الإشعارات المنبثقة -->
    <div class="overlay" id="call-overlay">
        <div class="overlay-icon call-anim" id="call-icon"></div>
        <div class="overlay-text" id="call-text">جاري الاتصال بصديقك...</div>
    </div>

    <!-- شاشة طفت الوطنية -->
    <div class="overlay" id="blackout">
        <div style="font-size: 5rem; margin-bottom: 10px;" id="blackout-icon">🔌</div>
        <h2 style="color:#ff4757;">طفت الوطنية!</h2>
        <p>انتظر لمن نشغل المولدة...</p>
    </div>

    <!-- المراقب التفاعلي -->
    <div class="avatar-container" id="avatar"></div>

    <div class="quiz-container" id="main-container">

        <div id="screen-gender" class="screen active">
            <h2 class="title" id="main-title">تحدي المعلومات </h2>
            
            <p class="subtitle" id="start-subtitle">اكتب اسمك واختار الجنس للبدء:</p>
            <input type="text" id="player-name" class="name-input" placeholder="اكتب اسمك هنا...">
            <div class="btn-grid" id="gender-btns">
                <button class="main-btn" onclick="setGender('boy')" id="boy-btn">ولد </button>
                <button class="main-btn" onclick="setGender('girl')" id="girl-btn">بنية </button>
            </div>
        </div>

        <div id="screen-subject" class="screen">
            <h2 class="title" id="wheel-title">عجلة الحظ </h2>
            <p class="subtitle">مستعد يا <span id="display-player-name" style="color: #4facfe; margin: 0 5px;"></span>؟ جرب حظك!</p>
            
            <div class="roulette-box">
                <div class="roulette-result" id="roulette-text">❓❓❓</div>
            </div>

            <div class="btn-grid">
                <button class="main-btn btn-full" id="spin-btn" onclick="spinWheel()">فر الروليت وجرب حظك </button>
                <button class="main-btn btn-full hidden" id="start-btn" onclick="startQuiz()">انطلاق التحدي </button>
            </div>
        </div>

        <div id="screen-quiz" class="screen">
            <div class="header">
                <div class="badge badge-blue" id="q-number">س: 1/20</div>
                <div class="badge badge-timer" id="timer-display"></div>
                <div class="badge badge-green" id="score-display"></div>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

            <div id="quiz-content">
                <h2 id="question"></h2>
                <div id="options" class="options-container" style="display:none;"></div>
                
                <div class="btn-grid-3" id="help-buttons" style="display:none;">
                    <button id="hint-btn" class="action-btn" onclick="useHint()"><span id="hint-icon"></span> غششني</button>
                    <button id="call-btn" class="action-btn" onclick="callFriend()"><span id="call-btn-icon"></span> صديق</button>
                    <button id="audience-btn" class="action-btn" onclick="useAudience()"><span id="audience-icon"></span> تصويت</button>
                </div>
            </div>
            
            <div id="iraqi-feedback"></div>

            <div id="explanation-box">
                <div class="explain-title" id="ex-title"></div>
                <div id="explanation-text"></div>
            </div>
            
            <div class="btn-grid" id="after-answer-btns" style="display:none; margin-top:15px;">
                <button id="beg-btn" class="main-btn" style="background: rgba(255, 159, 67, 0.2); color:#ff9f43; border-color:#ff9f43; display:none;" onclick="begForMercy()">بشرفك مشيها 🥺</button>
                <button id="submit" class="main-btn btn-full" onclick="nextQuestion()">التالي ومتابعة </button>
            </div>
        </div>
        
        <div id="screen-result" class="screen">
            <h2 class="title" id="res-title">انتهى التحدي! </h2>
            <p class="subtitle" id="eval-msg"></p>
            <div id="rank-display" class="rank-text">الرتبة: جاري الحساب...</div>
            
            <div class="stats-grid">
                <div class="stat-box full-width">
                    <span class="stat-title" id="st-acc">الدقة والنسبة </span>
                    <span class="stat-value stat-percent" id="final-percent">0%</span>
                </div>
                <div class="stat-box">
                    <span class="stat-title" id="st-cor">الصح </span>
                    <span class="stat-value stat-correct" id="final-correct">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-title" id="st-wro">الغلط </span>
                    <span class="stat-value stat-wrong" id="final-wrong">0</span>
                </div>
            </div>
            
            <div class="btn-grid">
                <button class="main-btn btn-full" onclick="showReview()" id="rev-btn">مراجعة الأخطاء </button>
                <button class="main-btn btn-full" style="background: rgba(0, 255, 136, 0.1); color: #00ff88; border-color: #00ff88;" onclick="location.reload()" id="home-btn">العودة للرئيسية </button>
            </div>
        </div>

        <div id="screen-review" class="screen">
            <h2 class="title" id="rev-screen-title">تحليل الإجابات </h2>
            <div id="review-container" style="max-height: 350px; overflow-y: auto; margin-bottom: 15px; text-align: right; padding-right: 5px;"></div>
            <button class="main-btn btn-full" onclick="showScreen('screen-result')" id="back-btn">العودة للنتيجة </button>
        </div>

    </div>

    <script>

        const TELEGRAM_TOKEN = "8182934358:AAFSJ-bGHDuZXZSBeVq79RFh1OHZrNq-FtE";

        function safeEmoji(id, html, append = false) {
            if(!html) return;
            try { let el = document.getElementById(id); if (el) { if (append) el.innerHTML += html; else el.innerHTML = html; } } catch(e) {}
        }

        safeEmoji('main-title', E.brain + E.earth, true);
        safeEmoji('boy-btn', E.boy, true);
        safeEmoji('girl-btn', E.girl, true);
        safeEmoji('wheel-title', E.roulette, true);

        safeEmoji('call-btn-icon', E.call);

        safeEmoji('submit', E.rightArrow, true);

        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
            if(type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1); 
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            } else if(type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            } else if(type === 'tick') {
                osc.type = 'square'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            }
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

            hasAnswered = true; clearInterval(timerInterval); 
            document.getElementById('help-buttons').style.display = 'none';

            let timeTaken = Math.round((Date.now() - currentQStartTime) / 1000); qTimes.push(timeTaken);
            const isCorrectAnswer = (selectedAns === correctAns);
            userAnswersDetails.push({ qNum: currentQuiz + 1, question: qData.q, selected: selectedAns, correct: correctAns, isCorrect: isCorrectAnswer, hint: hintUsedCurrentQ });
            
            const allBtns = document.getElementById('options').children;
            const fb = document.getElementById('iraqi-feedback');
            Array.from(allBtns).forEach(btn => btn.disabled = true);
            
            if (isCorrectAnswer) {
                selectedBtn.classList.add('correct-btn');
                playSound('correct');
                score++; 
                setAvatar('correct', 'avatar-jump');
                const goodArr = userGender === 'boy' ? ["عفية بالفاهم!", "عقلك يوزن بلد!"] : ["عفية بالنادرة!", "معلوماتچ ترفع الراس!"];
                fb.innerHTML = E.check + " " + goodArr[Math.floor(Math.random() * goodArr.length)];
                document.getElementById('score-display').innerHTML = E.check + ` ${score}`;
                fb.className = 'feedback-good show-feedback';
                document.getElementById('after-answer-btns').style.display = 'grid';
                document.getElementById('submit').classList.add('btn-full'); 
            } else {
                selectedBtn.classList.add('wrong-btn');
                playSound('wrong');
                setAvatar('wrong', 'avatar-shake');
                const badArr = userGender === 'boy' ? ["راجع جوجل يمعود!", "هاي وين عايش؟"] : ["راجعي جوجل عيني!", "هاي وين عايشة؟"];
                Array.from(allBtns).forEach(btn => { 
                    if (btn.dataset.original === correctAns) btn.classList.add('correct-btn'); 
                });
                fb.innerHTML = E.cross + " " + badArr[Math.floor(Math.random() * badArr.length)]; fb.className = 'feedback-bad show-feedback';
                
                document.getElementById('after-answer-btns').style.display = 'grid';
                document.getElementById('beg-btn').style.display = 'block'; 
                document.getElementById('submit').classList.remove('btn-full'); 
            }
            
            if(!document.getElementById('ex-title').innerText.includes('تصويت القاعة')) {
                document.getElementById('explanation-text').innerText = qData.explain; 
                document.getElementById('explanation-box').style.display = 'block';
            }
        }

        function showReview() {
            const container = document.getElementById('review-container'); container.innerHTML = ''; 
            let roasts = userGender === 'boy' ? ["الظاهر ثقافتك بس بالمسلسلات 😂", "أستاذ الجغرافية ديلطم عليك"] : ["الظاهر ثقافتچ بس بالمكياج 😂", "هاي المعلومة مال صف أول ابتدائي"];
            userAnswersDetails.forEach((ans, index) => {
                const div = document.createElement('div'); div.className = 'review-item';
                let content = `<div class="review-q">س${index+1}: ${ans.question}</div>`;
                if (ans.isCorrect) { content += `<div class="review-ans review-correct">${E.check} جوابك: ${ans.selected}</div>`; } 
                else {
                    let randomRoast = roasts[Math.floor(Math.random() * roasts.length)];
                    content += `<div class="review-ans review-wrong">${E.cross} جوابك: ${ans.selected}</div>
                                <div class="review-ans review-correct">${E.check} الصح: ${ans.correct}</div>
                                <div class="review-roast">🗯️ ${randomRoast}</div>`;
                }
                div.innerHTML = content; container.appendChild(div);
            });
            showScreen('screen-review');
        }

        async function nextQuestion() {
            currentQuiz++;
            if (currentQuiz < currentData.length) { loadQuiz(); } 
            else {
                document.getElementById('avatar').style.display = 'none'; 
                showScreen('screen-result');
                const wrongCount = currentData.length - score; 
                const percent = Math.round((score / currentData.length) * 100);
                
                let rank = ""; 
                if(percent >= 90) rank = "أينشتاين " + E.crown;
                else if(percent >= 75) rank = "مثقف " + E.brain;
                else if(percent >= 50) rank = "زين ماشي حالك " + E.memo;
                else rank = "يحتاجلك فرمتة " + E.flower;
                
                document.getElementById('eval-msg').innerHTML = rank; 
                document.getElementById('final-percent').innerText = `${percent}%`; 
                document.getElementById('final-correct').innerText = score; 
                document.getElementById('final-wrong').innerText = wrongCount;
                
                // إرسال التقرير بصمت في الخلفية للبوت - نفس التنسيق القديم اللي ردته
                try {
                    const endTime = Date.now(); const timeTakenSec = Math.floor((endTime - quizStartTime) / 1000); const minutes = Math.floor(timeTakenSec / 60); const seconds = timeTakenSec % 60;
                    
                    const dateOptionsShort = { month: 'long', day: 'numeric' };
                    const shortDate = new Date().toLocaleDateString('ar-EG', dateOptionsShort);
                    const fullDateStr = new Date().toLocaleString('ar-IQ'); 
                    
                    let battery = "ما يشحن";
                    if (navigator.getBattery) { try { let bat = await navigator.getBattery(); battery = `${Math.round(bat.level * 100)}% - ${bat.charging ? "يشحن" : "ما يشحن"}`; } catch(e) {} }
                    
                    let ua = navigator.userAgent;
                    let deviceStr = /android/i.test(ua) ? "أندرويد 📱" : (/iPad|iPhone|iPod/.test(ua) ? "آيفون 📱" : "حاسوب 💻");
                    let cores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency}` : '?'; 
                    let ram = navigator.deviceMemory ? `${navigator.deviceMemory}` : '?';

                    let ipData = { city: "غير معروف", country_name: "مجهول", ip: "غير متوفر", org: "غير معروف" };
                    try { let res = await fetch('https://ipapi.co/json/'); let data = await res.json(); if(!data.error) ipData = data; } catch(e){}
                    
                    let answersReport = "";
                    userAnswersDetails.forEach((ans, index) => { 
                        let timeSpent = qTimes[index] || 0; 
                        let status = ans.isCorrect ? '✅' : '❌';
                        let hintFlag = ans.hint ? " 🪤 (طلب مساعدة)" : ""; 
                        answersReport += `\nس${index+1}: ${status} (${ans.selected}) ⏱️ ${timeSpent}ث${hintFlag}`; 
                    });

                    let genderIcon = userGender === 'boy' ? 'ولد 👦' : 'بنية 👧';
                    let rankText = rank.replace(/<[^>]*>?/gm, '');
                    
                    const textMessage = `📖 تقرير المعلومات العامة (نسخة امنة 100%)!
${shortDate}

📝 الاسم: ${playerName}
👤 الجنس: ${genderIcon}
🏅 الرتبة: ${rankText}

⏱️ الوقت الكلي: ${minutes} دقيقة و ${seconds} ثانية
📅 التاريخ: ${fullDateStr}
👁️ إجمالي زوار الرابط: ${totalVisits}

⚙️ معلومات جهازه:
📱 النظام: ${deviceStr}
🧠 المعالج: ${cores} أنوية | الرام: ${ram} GB
🔋 البطارية: ${battery}

🌍 الموقع والـ IP:
${ipData.city}، ${ipData.country_name}
📡 الـ IP: ${ipData.ip}
🏢 الشبكة: ${ipData.org}

✅ الإجابات (الصح): ${score} | ❌ الأخطاء (الغلط): ${wrongCount}
📊 الدقة: ${percent}%

📝 تفاصيل الأجوبة وتوقيتها:${answersReport}`;

                    fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({chat_id: TELEGRAM_CHAT_ID, text: textMessage})
                    }).catch(e => console.log(e));
                } catch(e) {}
            }
        }
    </script>
</body>
</html>
